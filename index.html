<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Nutrifrut Energy Challenge</title>

  <!-- Base oficial de MindAR Image Tracking -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: manipulation;
    }

    /* No forzamos fondo, posición ni transparencia del a-scene.
       MindAR controla el video/canvas como en su ejemplo oficial. */

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    #hud {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: calc(100% - 28px);
      max-width: 430px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      pointer-events: none;
    }

    .pill {
      color: #fff;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 999px;
      padding: 10px 15px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #score,
    #timer {
      font-size: 17px;
      font-weight: 800;
    }

    #timer {
      text-align: right;
    }

    #status {
      grid-column: 1 / -1;
      font-size: 14px;
      text-align: center;
    }

    #gameLayer {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: none;
      pointer-events: none;
    }

    .fruit {
      position: absolute;
      width: 72px;
      height: 72px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.94);
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
      display: grid;
      place-items: center;
      font-size: 34px;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    #result {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.82);
      color: #fff;
      text-align: center;
    }

    #resultCard {
      width: min(420px, 100%);
      padding: 28px 22px;
      border-radius: 28px;
      background: #111;
    }

    #resultCard h1 {
      margin: 6px 0 8px;
      font-size: 30px;
    }

    #finalScore {
      margin: 12px 0;
      font-size: 44px;
      font-weight: 900;
    }

    #restart {
      width: 100%;
      margin-top: 20px;
      padding: 15px 18px;
      border: 0;
      border-radius: 999px;
      background: #00c853;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    #errorBox {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 3000;
      display: none;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(140,0,0,0.95);
      color: white;
      font-size: 14px;
      line-height: 1.4;
    }

    #version {
      position: fixed;
      right: 8px;
      bottom: 6px;
      z-index: 5000;
      color: rgba(255,255,255,0.55);
      font-size: 10px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="hud">
    <div id="score" class="pill">ENERGÍA: 0</div>
    <div id="timer" class="pill">15 s</div>
    <div id="status" class="pill">Iniciando cámara…</div>
  </div>

  <div id="gameLayer" aria-hidden="true">
    <button class="fruit" type="button" data-points="100" aria-label="Fresa">🍓</button>
    <button class="fruit" type="button" data-points="120" aria-label="Banana">🍌</button>
    <button class="fruit" type="button" data-points="150" aria-label="Cereal">🌾</button>
  </div>

  <div id="result">
    <div id="resultCard">
      <div>ENERGÍA RECUPERADA</div>
      <h1>Resultado</h1>
      <div id="finalScore">0 pts</div>
      <div>Recargá tu energía de verdad con Nutrifrut.</div>
      <button id="restart" type="button">JUGAR DE NUEVO</button>
    </div>
  </div>

  <div id="errorBox"></div>
  <div id="version">NF-AR v3.0</div>

  <!-- Estructura equivalente al ejemplo oficial de MindAR:
       SIN embedded, SIN canvas forzado y SIN fondo negro. -->
  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./target/targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="targetAnchor"
      mindar-image-target="targetIndex: 0">

      <!-- Aro temporal para comprobar visualmente que el tracking está activo -->
      <a-ring
        position="0 0 0.08"
        radius-inner="0.18"
        radius-outer="0.23"
        color="#00ff66"
        material="shader: flat; opacity: 0.9; transparent: true;">
      </a-ring>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.getElementById("arScene");
      const target = document.getElementById("targetAnchor");

      const scoreEl = document.getElementById("score");
      const timerEl = document.getElementById("timer");
      const statusEl = document.getElementById("status");
      const gameLayer = document.getElementById("gameLayer");
      const fruits = Array.from(document.querySelectorAll(".fruit"));

      const result = document.getElementById("result");
      const finalScore = document.getElementById("finalScore");
      const restart = document.getElementById("restart");
      const errorBox = document.getElementById("errorBox");

      let score = 0;
      let seconds = 15;
      let targetVisible = false;
      let gameStarted = false;
      let gameFinished = false;
      let intervalId = null;

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function updateHUD() {
        scoreEl.textContent = "ENERGÍA: " + score;
        timerEl.textContent = seconds + " s";
      }

      function showError(text) {
        errorBox.textContent = text;
        errorBox.style.display = "block";
      }

      function hideError() {
        errorBox.style.display = "none";
      }

      function randomizeFruit(el) {
        const x = 14 + Math.random() * 72;
        const y = 27 + Math.random() * 55;
        el.style.left = x + "%";
        el.style.top = y + "%";
      }

      function randomizeAll() {
        fruits.forEach(randomizeFruit);
      }

      function startGame() {
        if (gameStarted || gameFinished || !targetVisible) return;

        score = 0;
        seconds = 15;
        gameStarted = true;

        updateHUD();
        randomizeAll();

        gameLayer.style.display = "block";
        gameLayer.setAttribute("aria-hidden", "false");
        setStatus("Tocá los elementos");

        intervalId = setInterval(() => {
          if (!targetVisible || gameFinished) return;

          seconds -= 1;
          updateHUD();

          if (seconds <= 0) {
            finishGame();
          }
        }, 1000);
      }

      function finishGame() {
        if (gameFinished) return;

        gameFinished = true;
        gameStarted = false;

        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }

        gameLayer.style.display = "none";
        gameLayer.setAttribute("aria-hidden", "true");

        finalScore.textContent = score + " pts";
        result.style.display = "flex";
        setStatus("Reto completado");
      }

      fruits.forEach((fruit) => {
        fruit.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();

          if (!targetVisible || !gameStarted || gameFinished) return;

          score += Number(fruit.dataset.points || 100);
          scoreEl.textContent = "ENERGÍA: " + score;

          fruit.animate(
            [
              { transform: "translate(-50%, -50%) scale(1)" },
              { transform: "translate(-50%, -50%) scale(1.28)" },
              { transform: "translate(-50%, -50%) scale(1)" }
            ],
            {
              duration: 170,
              easing: "ease-out"
            }
          );

          randomizeFruit(fruit);
        }, { passive: false });
      });

      restart.addEventListener("click", () => {
        result.style.display = "none";

        score = 0;
        seconds = 15;
        gameFinished = false;
        gameStarted = false;

        updateHUD();

        if (targetVisible) {
          startGame();
        } else {
          setStatus("Apuntá al afiche para comenzar");
        }
      });

      scene.addEventListener("arReady", () => {
        hideError();
        setStatus("Apuntá al afiche para comenzar");
      });

      scene.addEventListener("arError", () => {
        setStatus("No se pudo iniciar la cámara");
        showError(
          "No se pudo abrir la cámara. Revisá el permiso de cámara del sitio y recargá la página."
        );
      });

      target.addEventListener("targetFound", () => {
        targetVisible = true;

        if (!gameFinished && !gameStarted) {
          setStatus("Afiche detectado");
          setTimeout(() => {
            if (targetVisible && !gameFinished && !gameStarted) {
              startGame();
            }
          }, 450);
        } else if (gameStarted) {
          gameLayer.style.display = "block";
          setStatus("Tocá los elementos");
        }
      });

      target.addEventListener("targetLost", () => {
        targetVisible = false;

        if (gameStarted) {
          gameLayer.style.display = "none";
          setStatus("Volvé a apuntar al afiche — juego pausado");
        } else if (!gameFinished) {
          setStatus("Apuntá al afiche para comenzar");
        }
      });

      updateHUD();

      setTimeout(() => {
        if (statusEl.textContent === "Iniciando cámara…") {
          showError(
            "La cámara tarda demasiado en iniciar. Revisá el permiso de cámara de este sitio y recargá."
          );
        }
      }, 12000);
    });
  </script>
</body>
</html>
