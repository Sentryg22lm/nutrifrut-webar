<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Nutrifrut Energy Challenge</title>

  <!-- Versiones estables usadas por MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: manipulation;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    /* UI superior */
    #hud {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      width: calc(100% - 32px);
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      pointer-events: none;
    }

    .pill {
      background: rgba(0,0,0,.78);
      color: #fff;
      border-radius: 999px;
      padding: 11px 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #status {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 14px;
    }

    #score, #timer {
      font-size: 17px;
      font-weight: 700;
    }

    #timer { text-align: right; }

    /* Capa del juego: HTML normal, no raycaster de A-Frame */
    #gameLayer {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: none;
      pointer-events: none;
    }

    .fruit {
      position: absolute;
      width: 74px;
      height: 74px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: auto;
      background: rgba(255,255,255,.94);
      box-shadow: 0 8px 20px rgba(0,0,0,.24);
      transform: translate(-50%, -50%) scale(1);
      transition: transform .12s ease;
    }

    .fruit:active {
      transform: translate(-50%, -50%) scale(.84);
    }

    /* Pantalla final */
    #result {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,.86);
      color: #fff;
      text-align: center;
    }

    #resultCard {
      width: min(420px, 100%);
      background: #111;
      border-radius: 28px;
      padding: 28px 24px;
    }

    #resultCard h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    #finalScore {
      font-size: 46px;
      font-weight: 800;
      margin: 14px 0;
    }

    #restart {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 16px 20px;
      margin-top: 18px;
      font-size: 16px;
      font-weight: 800;
      background: #00c853;
      color: #fff;
      cursor: pointer;
    }

    /* Mensaje de error */
    #errorBox {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 30000;
      display: none;
      background: #8b0000;
      color: #fff;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.35;
    }
  </style>
</head>

<body>

  <div id="hud">
    <div id="score" class="pill">ENERGÍA: 0</div>
    <div id="timer" class="pill">15 s</div>
    <div id="status" class="pill">Iniciando cámara…</div>
  </div>

  <div id="gameLayer" aria-hidden="true">
    <button class="fruit" type="button" data-points="100" aria-label="Fruta">🍓</button>
    <button class="fruit" type="button" data-points="120" aria-label="Fruta">🍌</button>
    <button class="fruit" type="button" data-points="150" aria-label="Cereal">🌾</button>
  </div>

  <div id="result">
    <div id="resultCard">
      <div>ENERGÍA RECUPERADA</div>
      <h1>Resultado</h1>
      <div id="finalScore">0</div>
      <div>Recargá tu energía de verdad con Nutrifrut.</div>
      <button id="restart" type="button">JUGAR DE NUEVO</button>
    </div>
  </div>

  <div id="errorBox"></div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./target/targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="targetAnchor"
      mindar-image-target="targetIndex: 0">

      <!-- Elemento AR mínimo para confirmar que el tracking está anclado -->
      <a-ring
        position="0 0 0.08"
        radius-inner="0.18"
        radius-outer="0.23"
        color="#00ff66"
        material="shader: flat; opacity: 0.9; transparent: true;">
      </a-ring>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.getElementById("arScene");
      const target = document.getElementById("targetAnchor");

      const scoreEl = document.getElementById("score");
      const timerEl = document.getElementById("timer");
      const statusEl = document.getElementById("status");
      const gameLayer = document.getElementById("gameLayer");
      const fruits = [...document.querySelectorAll(".fruit")];

      const result = document.getElementById("result");
      const finalScore = document.getElementById("finalScore");
      const restart = document.getElementById("restart");
      const errorBox = document.getElementById("errorBox");

      let score = 0;
      let seconds = 15;
      let targetVisible = false;
      let gameStarted = false;
      let gameFinished = false;
      let intervalId = null;

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function showError(text) {
        errorBox.textContent = text;
        errorBox.style.display = "block";
      }

      function hideError() {
        errorBox.style.display = "none";
      }

      function randomizeFruit(el) {
        // Mantenerlos lejos del HUD y de los bordes.
        const x = 14 + Math.random() * 72; // 14% - 86%
        const y = 25 + Math.random() * 58; // 25% - 83%
        el.style.left = x + "%";
        el.style.top = y + "%";
      }

      function randomizeAll() {
        fruits.forEach(randomizeFruit);
      }

      function updateHUD() {
        scoreEl.textContent = "ENERGÍA: " + score;
        timerEl.textContent = seconds + " s";
      }

      function startGame() {
        if (gameStarted || gameFinished) return;

        gameStarted = true;
        seconds = 15;
        score = 0;
        updateHUD();
        randomizeAll();

        gameLayer.style.display = "block";
        gameLayer.setAttribute("aria-hidden", "false");

        setStatus("Tocá los elementos");

        intervalId = setInterval(() => {
          if (!targetVisible) return; // pausa cuando se pierde el afiche

          seconds -= 1;
          updateHUD();

          if (seconds <= 0) {
            finishGame();
          }
        }, 1000);
      }

      function finishGame() {
        if (gameFinished) return;

        gameFinished = true;
        gameStarted = false;

        clearInterval(intervalId);
        intervalId = null;

        gameLayer.style.display = "none";
        gameLayer.setAttribute("aria-hidden", "true");

        finalScore.textContent = score + " pts";
        result.style.display = "flex";
        setStatus("Reto completado");
      }

      fruits.forEach((fruit) => {
        fruit.addEventListener("pointerdown", (ev) => {
          ev.preventDefault();
          ev.stopPropagation();

          if (!gameStarted || gameFinished || !targetVisible) return;

          score += Number(fruit.dataset.points || 100);
          scoreEl.textContent = "ENERGÍA: " + score;

          fruit.animate(
            [
              { transform: "translate(-50%, -50%) scale(1)" },
              { transform: "translate(-50%, -50%) scale(1.28)" },
              { transform: "translate(-50%, -50%) scale(1)" }
            ],
            { duration: 180, easing: "ease-out" }
          );

          randomizeFruit(fruit);
        }, { passive: false });
      });

      restart.addEventListener("click", () => {
        result.style.display = "none";
        score = 0;
        seconds = 15;
        gameFinished = false;
        gameStarted = false;
        updateHUD();

        if (targetVisible) {
          startGame();
        } else {
          setStatus("Apuntá al afiche para comenzar");
        }
      });

      scene.addEventListener("arReady", () => {
        hideError();
        setStatus("Apuntá al afiche para comenzar");
      });

      scene.addEventListener("arError", () => {
        setStatus("No se pudo iniciar la cámara");
        showError(
          "No se pudo abrir la cámara. Verificá que el sitio tenga permiso de cámara y abrilo en Chrome mediante HTTPS."
        );
      });

      target.addEventListener("targetFound", () => {
        targetVisible = true;

        if (!gameStarted && !gameFinished) {
          setStatus("Afiche detectado");
          setTimeout(() => {
            if (targetVisible && !gameStarted && !gameFinished) startGame();
          }, 500);
        } else if (gameStarted) {
          setStatus("Tocá los elementos");
          gameLayer.style.display = "block";
        }
      });

      target.addEventListener("targetLost", () => {
        targetVisible = false;

        if (gameStarted) {
          setStatus("Volvé a apuntar al afiche — juego pausado");
          gameLayer.style.display = "none";
        } else if (!gameFinished) {
          setStatus("Apuntá al afiche para comenzar");
        }
      });

      updateHUD();

      // Diagnóstico: si tras 12 s MindAR no informa arReady ni arError,
      // se muestra un mensaje útil sin bloquear la app.
      setTimeout(() => {
        if (statusEl.textContent === "Iniciando cámara…") {
          showError(
            "La cámara sigue sin iniciar. Revisá el permiso de cámara del sitio y recargá la página. No uses modo incógnito."
          );
        }
      }, 12000);
    });
  </script>
</body>
</html>
