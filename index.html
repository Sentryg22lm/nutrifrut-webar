<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    window.score = 0;

    AFRAME.registerComponent("tap-score", {
      init: function () {

        this.el.addEventListener("click", () => {

          // Sumar puntos
          window.score += 100;

          // Actualizar marcador
          document.getElementById("score").textContent =
            "ENERGÍA: " + window.score;

          // Pequeña animación al tocar
          this.el.object3D.scale.set(1.3, 1.3, 1.3);

          setTimeout(() => {
            this.el.object3D.scale.set(1, 1, 1);
          }, 120);

        });

      }
    });
  </script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Ocultar botón VR */
    .a-enter-vr {
      display: none !important;
    }

    #hud {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 9999;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      padding: 12px 22px;
      border-radius: 30px;

      text-align: center;
      pointer-events: none;
    }

    #score {
      font-size: 20px;
      font-weight: bold;
    }

    #instruction {
      font-size: 11px;
      margin-top: 3px;
    }

  </style>

</head>

<body>

  <!-- INTERFAZ -->

  <div id="hud">

    <div id="score">
      ENERGÍA: 0
    </div>

    <div id="instruction">
      Tocá los elementos
    </div>

  </div>


  <!-- ESCENA AR -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./target/targets.mind;
      autoStart: true;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >

    <!-- CÁMARA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

      cursor="
        rayOrigin: mouse;
        fuse: false
      "

      raycaster="
        objects: .clickable
      "

    >
    </a-camera>


    <!-- CONTENIDO QUE APARECE SOBRE EL AFICHE -->

    <a-entity mindar-image-target="targetIndex: 0">


      <!-- OBJETO 1 -->

      <a-circle

        class="clickable"

        tap-score

        position="-0.30 0.15 0.1"

        radius="0.12"

        color="#FFB000"

      >
      </a-circle>


      <!-- OBJETO 2 -->

      <a-circle

        class="clickable"

        tap-score

        position="0 0.28 0.1"

        radius="0.12"

        color="#00C853"

      >
      </a-circle>


      <!-- OBJETO 3 -->

      <a-circle

        class="clickable"

        tap-score

        position="0.30 0.15 0.1"

        radius="0.12"

        color="#FF6D00"

      >
      </a-circle>


    </a-entity>

  </a-scene>

</body>

</html>
