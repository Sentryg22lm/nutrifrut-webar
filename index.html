<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Nutrifrut | Fase 3</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #hud {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      z-index: 1000;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      pointer-events: none;
    }

    .counter {
      margin: 0;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.4;
    }

    #energy {
      color: #ffe45c;
    }

    #timer {
      font-variant-numeric: tabular-nums;
    }

    #status {
      grid-column: 1 / -1;
      margin: 0;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="hud">
    <p id="energy" class="counter">
      ENERGÍA: <span id="score">0</span>
    </p>

    <p id="timer" class="counter"
       aria-label="Tiempo: 15 segundos">
      15 s
    </p>

    <p id="status" role="status" aria-live="polite">
      Iniciando cámara… Permití el acceso a la cámara.
    </p>
  </div>

  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: ./target/targets.mind;
      uiLoading: no;
      uiScanning: no;
      uiError: no;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="targetAnchor"
      mindar-image-target="targetIndex: 0">

      <a-ring
        position="0 0 0.01"
        radius-inner="0.18"
        radius-outer="0.23"
        color="#00ff66"
        material="shader: flat; side: double;">
      </a-ring>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.getElementById("arScene");
      const target = document.getElementById("targetAnchor");
      const status = document.getElementById("status");
      const timer = document.getElementById("timer");

      let ready = false;
      let targetVisible = false;
      let running = false;
      let started = false;
      let finished = false;
      let failed = false;

      let remaining = 15000;
      let lastTick = 0;
      let pendingStart = null;
      let frame = null;

      function renderTime() {
        const seconds = Math.ceil(remaining / 1000);
        const label = seconds + " s";

        if (timer.textContent.trim() !== label) {
          timer.textContent = label;
          timer.setAttribute(
            "aria-label",
            "Tiempo: " + seconds + " segundos"
          );
        }
      }

      function cancelPendingStart() {
        clearTimeout(pendingStart);
        pendingStart = null;
      }

      function finish() {
        finished = true;
        running = false;

        cancelPendingStart();
        cancelAnimationFrame(frame);

        frame = null;
        remaining = 0;
        renderTime();

        status.textContent =
          "Prueba de tiempo terminada. Recargá para repetir.";
      }

      function consumeTime() {
        const now = performance.now();

        remaining = Math.max(
          0,
          remaining - (now - lastTick)
        );

        lastTick = now;
        renderTime();
      }

      function tick() {
        if (!running) return;

        consumeTime();

        if (remaining === 0) {
          finish();
          return;
        }

        frame = requestAnimationFrame(tick);
      }

      function pause() {
        if (!running) return;

        consumeTime();
        running = false;

        cancelAnimationFrame(frame);
        frame = null;

        if (remaining === 0) finish();
      }

      function scheduleStart() {
        cancelPendingStart();

        if (
          !ready ||
          !targetVisible ||
          running ||
          finished ||
          failed ||
          document.hidden
        ) return;

        status.textContent = started
          ? "Afiche detectado. Preparando continuación…"
          : "Afiche detectado. Preparando inicio…";

        pendingStart = setTimeout(() => {
          pendingStart = null;

          if (
            !targetVisible ||
            document.hidden ||
            finished ||
            failed
          ) return;

          started = true;
          running = true;
          lastTick = performance.now();

          status.textContent =
            "Prueba en curso: mantené el afiche a la vista";

          frame = requestAnimationFrame(tick);
        }, 500);
      }

      if (
        !window.AFRAME ||
        !AFRAME.components["mindar-image"]
      ) {
        status.textContent =
          "No se pudo cargar la experiencia. Revisá tu conexión y recargá.";

        console.error(
          "[Nutrifrut] No se cargaron A-Frame o MindAR."
        );

        return;
      }

      scene.addEventListener("arReady", () => {
        ready = true;
        status.textContent = "Cámara lista: Apuntá al afiche";
        scheduleStart();
      });

      scene.addEventListener("arError", (event) => {
        failed = true;
        ready = false;

        cancelPendingStart();
        pause();

        status.textContent =
          "No se pudo abrir la cámara. Revisá los permisos y recargá.";

        console.error("[Nutrifrut] arError", event.detail);
      });

      target.addEventListener("targetFound", () => {
        targetVisible = true;
        scheduleStart();
      });

      target.addEventListener("targetLost", () => {
        targetVisible = false;

        cancelPendingStart();
        pause();

        if (finished || failed) return;

        status.textContent = started
          ? "Prueba pausada: volvé a apuntar al afiche"
          : "Volvé a apuntar al afiche";
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          cancelPendingStart();
          pause();

          if (started && !finished && !failed) {
            status.textContent = "Prueba pausada";
          }
        } else {
          scheduleStart();
        }
      });

      renderTime();
    });
  </script>
</body>
</html>
