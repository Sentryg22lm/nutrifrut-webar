<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Nutrifrut | Prueba WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Contiene las capas de cámara y AR sin alterar el video. */
    #ar-container {
      position: fixed;
      inset: 0;
      isolation: isolate;
      overflow: hidden;
    }

    #controls {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      z-index: 10;
      text-align: center;
    }

    #status {
      margin: 0 0 12px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      line-height: 1.4;
    }

    button {
      padding: 14px 22px;
      border: 0;
      border-radius: 12px;
      background: #ffe45c;
      color: #182218;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="ar-container">
    <a-scene
      id="scene"
      mindar-image="
        imageTargetSrc: ./target/targets.mind;
        autoStart: false;
        uiLoading: no;
        uiScanning: no;
        uiError: no;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <a-entity
        id="marker"
        mindar-image-target="targetIndex: 0">

        <a-ring
          position="0 0 0.01"
          radius-inner="0.18"
          radius-outer="0.23"
          color="#00ff66"
          material="shader: flat; side: double;">
        </a-ring>

      </a-entity>
    </a-scene>
  </div>

  <div id="controls">
    <p id="status" role="status" aria-live="polite">
      Cargando experiencia…
    </p>

    <button id="start" type="button" disabled>
      INICIAR CÁMARA
    </button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.getElementById("scene");
      const marker = document.getElementById("marker");
      const status = document.getElementById("status");
      const button = document.getElementById("start");

      let starting = false;
      let failed = false;
      let arSystem;

      function fail(message, error) {
        console.error("[Nutrifrut]", message, error);

        failed = true;
        starting = false;

        status.textContent = message;
        button.textContent = "RECARGAR";
        button.disabled = false;
        button.hidden = false;
      }

      button.addEventListener("click", () => {
        if (failed) {
          window.location.reload();
          return;
        }

        if (starting || !arSystem) return;

        starting = true;
        button.hidden = true;

        status.textContent =
          "Permití el acceso a la cámara. Iniciando reconocimiento…";

        try {
          arSystem.start();
        } catch (error) {
          fail(
            "No se pudo iniciar la experiencia. Recargá e intentá nuevamente.",
            error
          );
        }
      });

      if (!window.AFRAME || !AFRAME.components["mindar-image"]) {
        fail(
          "No se cargaron las librerías. Revisá tu conexión y recargá."
        );
        return;
      }

      if (
        !window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia
      ) {
        fail(
          "La cámara no está disponible. Abrí el enlace HTTPS en Chrome o Safari."
        );
        return;
      }

      function prepare() {
        if (failed) return;

        arSystem = scene.systems["mindar-image-system"];

        if (!arSystem) {
          fail("No se pudo cargar el reconocimiento del afiche.");
          return;
        }

        status.textContent =
          "Tocá INICIAR CÁMARA y permití el acceso.";

        button.disabled = false;
      }

      if (scene.hasLoaded) {
        prepare();
      } else {
        scene.addEventListener("loaded", prepare, { once: true });
      }

      scene.addEventListener("arReady", () => {
        starting = false;

        status.textContent = "Cámara lista: Apuntá al afiche";
        console.info("[Nutrifrut] arReady");
      });

      scene.addEventListener("arError", (event) => {
        fail(
          "No se pudo abrir la cámara. Revisá los permisos del navegador y recargá.",
          event.detail
        );
      });

      marker.addEventListener("targetFound", () => {
        status.textContent = "Afiche detectado";
        console.info("[Nutrifrut] targetFound: 0");
      });

      marker.addEventListener("targetLost", () => {
        status.textContent = "Volvé a apuntar al afiche";
        console.info("[Nutrifrut] targetLost: 0");
      });

      window.addEventListener("unhandledrejection", (event) => {
        if (starting) {
          fail(
            "No se pudo iniciar el reconocimiento. Comprobá la conexión y el archivo target/targets.mind.",
            event.reason
          );
        }
      });
    });
  </script>
</body>
</html>
