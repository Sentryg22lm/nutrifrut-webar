<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Nutrifrut | Fase 2</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #hud {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      z-index: 1000;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      pointer-events: none;
    }

    .counter {
      margin: 0;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.4;
    }

    #energy {
      color: #ffe45c;
    }

    #timer {
      font-variant-numeric: tabular-nums;
    }

    #status {
      grid-column: 1 / -1;
      margin: 0;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="hud">
    <p id="energy" class="counter">
      ENERGÍA: <span id="score">0</span>
    </p>

    <p id="timer" class="counter"
       aria-label="Tiempo: 15 segundos">
      15 s
    </p>

    <p id="status" role="status" aria-live="polite">
      Iniciando cámara… Permití el acceso a la cámara.
    </p>
  </div>

  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: ./target/targets.mind;
      uiLoading: no;
      uiScanning: no;
      uiError: no;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="targetAnchor"
      mindar-image-target="targetIndex: 0">

      <a-ring
        position="0 0 0.01"
        radius-inner="0.18"
        radius-outer="0.23"
        color="#00ff66"
        material="shader: flat; side: double;">
      </a-ring>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.getElementById("arScene");
      const target = document.getElementById("targetAnchor");
      const status = document.getElementById("status");

      if (!window.AFRAME || !AFRAME.components["mindar-image"]) {
        status.textContent =
          "No se pudo cargar la experiencia. Revisá tu conexión y recargá.";

        console.error(
          "[Nutrifrut Fase 2] No se cargaron A-Frame o MindAR."
        );

        return;
      }

      scene.addEventListener("arReady", () => {
        status.textContent = "Cámara lista: Apuntá al afiche";
        console.info("[Nutrifrut Fase 2] arReady");
      });

      scene.addEventListener("arError", (event) => {
        status.textContent =
          "No se pudo abrir la cámara. Revisá los permisos y recargá.";

        console.error(
          "[Nutrifrut Fase 2] arError",
          event.detail
        );
      });

      target.addEventListener("targetFound", () => {
        status.textContent = "Afiche detectado";
        console.info("[Nutrifrut Fase 2] targetFound: 0");
      });

      target.addEventListener("targetLost", () => {
        status.textContent = "Volvé a apuntar al afiche";
        console.info("[Nutrifrut Fase 2] targetLost: 0");
      });
    });
  </script>
</body>
</html>
