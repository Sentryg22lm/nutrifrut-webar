<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    #hud {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 99999;

      width: 80%;
      max-width: 340px;

      padding: 14px 18px;

      border-radius: 24px;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      text-align: center;

      pointer-events: none;
    }

    #score {
      font-size: 22px;
      font-weight: bold;
    }

    #status {
      font-size: 14px;
      margin-top: 5px;
    }

  </style>
</head>


<body>

  <!-- INTERFAZ -->

  <div id="hud">

    <div id="score">
      ENERGÍA: 0
    </div>

    <div id="status">
      Iniciando cámara...
    </div>

  </div>


  <!-- REALIDAD AUMENTADA -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./target/targets.mind;
      uiScanning: no;
      uiLoading: no;
      uiError: no;
    "

    embedded

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
      alpha: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- CÁMARA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

      cursor="
        fuse: false;
        rayOrigin: mouse;
      "

      raycaster="
        far: 10000;
        objects: .clickable;
      "

    >
    </a-camera>


    <!-- MARCADOR -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >


      <!-- CÍRCULO IZQUIERDO -->

      <a-circle
        class="clickable"
        position="-0.32 0.12 0.1"
        radius="0.15"
        color="#FF9800"
      >
      </a-circle>


      <!-- CÍRCULO CENTRAL -->

      <a-circle
        class="clickable"
        position="0 0.35 0.1"
        radius="0.15"
        color="#00C853"
      >
      </a-circle>


      <!-- CÍRCULO DERECHO -->

      <a-circle
        class="clickable"
        position="0.32 0.12 0.1"
        radius="0.15"
        color="#FF5722"
      >
      </a-circle>


    </a-entity>

  </a-scene>


  <script>

    document.addEventListener("DOMContentLoaded", function () {

      let score = 0;

      let targetVisible = false;


      const scoreElement =
        document.getElementById("score");

      const statusElement =
        document.getElementById("status");

      const scene =
        document.querySelector("a-scene");

      const target =
        document.getElementById("target");

      const objects =
        document.querySelectorAll(".clickable");


      // ------------------------------------
      // CÁMARA LISTA
      // ------------------------------------

      scene.addEventListener("arReady", function () {

        statusElement.textContent =
          "Apuntá al afiche";

      });


      // ------------------------------------
      // ERROR DE CÁMARA
      // ------------------------------------

      scene.addEventListener("arError", function () {

        statusElement.textContent =
          "No se pudo iniciar la cámara";

      });


      // ------------------------------------
      // MARCADOR ENCONTRADO
      // ------------------------------------

      target.addEventListener(
        "targetFound",
        function () {

          targetVisible = true;

          statusElement.textContent =
            "¡Detectado! Tocá los círculos";

        }
      );


      // ------------------------------------
      // MARCADOR PERDIDO
      // ------------------------------------

      target.addEventListener(
        "targetLost",
        function () {

          targetVisible = false;

          statusElement.textContent =
            "Volvé a apuntar al afiche";

        }
      );


      // ------------------------------------
      // TOCAR LOS OBJETOS
      // ------------------------------------

      objects.forEach(function (object) {

        object.addEventListener(
          "click",
          function (event) {

            // Si no estamos viendo el afiche,
            // NO sumar puntos.

            if (!targetVisible) {
              return;
            }


            event.stopPropagation();


            // SUMAR

            score += 100;


            scoreElement.textContent =
              "ENERGÍA: " + score;


            // AGRANDAR

            object.setAttribute(
              "scale",
              "1.4 1.4 1.4"
            );


            // VOLVER AL TAMAÑO NORMAL

            setTimeout(function () {

              object.setAttribute(
                "scale",
                "1 1 1"
              );

            }, 150);

          }
        );

      });

    });

  </script>

</body>

</html>
