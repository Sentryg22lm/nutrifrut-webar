<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <!-- A-FRAME recomendado por MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;

      background: #111;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      color: white;
      text-align: center;
    }

    #startButton {
      border: 0;
      border-radius: 40px;

      padding: 18px 30px;

      background: #00c853;
      color: white;

      font-size: 18px;
      font-weight: bold;

      margin-top: 20px;
    }

    #status {
      position: fixed;

      top: 25px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 9999;

      background: rgba(0,0,0,.75);
      color: white;

      padding: 12px 20px;
      border-radius: 30px;

      font-size: 15px;

      display: none;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

  </style>

</head>

<body>


  <!-- PANTALLA INICIAL -->

  <div id="startScreen">

    <h1>NUTRIFRUT</h1>

    <p>
      Activá la cámara para comenzar
    </p>

    <button id="startButton">
      INICIAR EXPERIENCIA
    </button>

  </div>


  <!-- ESTADO -->

  <div id="status">
    Iniciando...
  </div>


  <!-- ESCENA -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./target/targets.mind;
      autoStart: false;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- CÁMARA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>


    <!-- TARGET -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

      <!-- PRUEBA VERDE -->

      <a-plane

        color="#00ff00"

        width="0.6"
        height="0.3"

        position="0 0 0.1"

      >
      </a-plane>

    </a-entity>


  </a-scene>


  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const scene =
          document.querySelector("a-scene");

        const startScreen =
          document.getElementById("startScreen");

        const startButton =
          document.getElementById("startButton");

        const status =
          document.getElementById("status");

        const target =
          document.getElementById("target");


        let arSystem = null;


        // Esperamos a que A-Frame termine de cargar
        scene.addEventListener(
          "loaded",
          function () {

            arSystem =
              scene.systems["mindar-image-system"];

          }
        );


        // BOTÓN INICIAR

        startButton.addEventListener(
          "click",
          async function () {

            if (!arSystem) {

              status.style.display = "block";

              status.textContent =
                "Esperá un momento...";

              return;

            }


            startButton.disabled = true;

            startButton.textContent =
              "ABRIENDO CÁMARA...";


            try {

              await arSystem.start();

            }

            catch (error) {

              console.error(error);

              startButton.disabled = false;

              startButton.textContent =
                "INTENTAR DE NUEVO";

            }

          }
        );


        // CÁMARA FUNCIONANDO

        scene.addEventListener(
          "arReady",
          function () {

            startScreen.style.display = "none";

            status.style.display = "block";

            status.textContent =
              "Apuntá al afiche";

          }
        );


        // ERROR

        scene.addEventListener(
          "arError",
          function () {

            startButton.disabled = false;

            startButton.textContent =
              "INTENTAR DE NUEVO";

          }
        );


        // TARGET DETECTADO

        target.addEventListener(
          "targetFound",
          function () {

            status.textContent =
              "AFICHE DETECTADO";

          }
        );


        // TARGET PERDIDO

        target.addEventListener(
          "targetLost",
          function () {

            status.textContent =
              "Apuntá nuevamente al afiche";

          }
        );

      }
    );

  </script>


</body>
</html>
